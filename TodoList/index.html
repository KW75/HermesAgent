<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todo List</title>
<style>
  :root {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --text: #1a1d26;
    --text-soft: #6b7280;
    --accent: #4f46e5;
    --accent-soft: #eef2ff;
    --danger: #ef4444;
    --border: #e5e7eb;
    --radius: 14px;
    --shadow: 0 1px 3px rgba(16,24,40,.06), 0 8px 24px rgba(16,24,40,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1117;
      --surface: #181b23;
      --text: #f3f4f6;
      --text-soft: #9ca3af;
      --accent: #6366f1;
      --accent-soft: #1e1b3a;
      --danger: #f87171;
      --border: #2a2e3a;
      --shadow: 0 1px 3px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 48px 16px;
  }
  .app {
    width: 100%;
    max-width: 560px;
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 32px;
    border: 1px solid var(--border);
  }
  header { margin-bottom: 24px; }
  header h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; }
  header .date { color: var(--text-soft); font-size: 14px; margin-top: 4px; }

  .add-row { display: flex; gap: 10px; margin-bottom: 20px; }
  .add-row input {
    flex: 1;
    padding: 12px 14px;
    font-size: 15px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .add-row input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .add-row button {
    padding: 12px 20px;
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: transform .1s, filter .15s;
  }
  .add-row button:hover { filter: brightness(1.08); }
  .add-row button:active { transform: scale(.97); }

  .filters {
    display: flex;
    gap: 6px;
    margin-bottom: 16px;
    background: var(--bg);
    padding: 5px;
    border-radius: 10px;
  }
  .filters button {
    flex: 1;
    padding: 7px 0;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-soft);
    background: transparent;
    border: none;
    border-radius: 7px;
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .filters button.active {
    background: var(--surface);
    color: var(--text);
    font-weight: 600;
    box-shadow: 0 1px 2px rgba(16,24,40,.08);
  }

  ul { list-style: none; display: flex; flex-direction: column; gap: 8px; }
  li {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    transition: background .15s;
    animation: slideIn .18s ease;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .check {
    width: 22px; height: 22px;
    flex-shrink: 0;
    border: 2px solid var(--border);
    border-radius: 50%;
    cursor: pointer;
    display: grid; place-items: center;
    transition: border-color .15s, background .15s;
    background: transparent;
    padding: 0;
  }
  .check:hover { border-color: var(--accent); }
  .check svg { opacity: 0; transition: opacity .15s; }
  li.done .check { background: var(--accent); border-color: var(--accent); }
  li.done .check svg { opacity: 1; }
  li.done .txt { color: var(--text-soft); text-decoration: line-through; }
  .txt { flex: 1; font-size: 15px; word-break: break-word; }
  .del {
    border: none;
    background: transparent;
    color: var(--text-soft);
    font-size: 18px;
    cursor: pointer;
    padding: 4px 6px;
    border-radius: 6px;
    opacity: 0;
    transition: opacity .15s, color .15s, background .15s;
  }
  li:hover .del, .del:focus-visible { opacity: 1; }
  .del:hover { color: var(--danger); background: rgba(239,68,68,.08); }

  .empty {
    text-align: center;
    color: var(--text-soft);
    font-size: 14px;
    padding: 32px 0;
  }
  footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    font-size: 13px;
    color: var(--text-soft);
  }
  footer button {
    border: none; background: transparent;
    color: var(--text-soft);
    font-size: 13px; font-weight: 500;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 6px;
    transition: color .15s, background .15s;
  }
  footer button:hover { color: var(--danger); background: rgba(239,68,68,.08); }
</style>
</head>
<body>
  <main class="app">
    <header>
      <h1>待辦事項</h1>
      <div class="date" id="date"></div>
    </header>

    <form class="add-row" id="addForm">
      <input type="text" id="taskInput" placeholder="加入新事項…" maxlength="200" autocomplete="off" aria-label="新事項">
      <button type="submit">加入</button>
    </form>

    <nav class="filters" id="filters" aria-label="篩選">
      <button data-f="all" class="active">全部</button>
      <button data-f="active">未完成</button>
      <button data-f="done">已完成</button>
    </nav>

    <ul id="list"></ul>
    <div class="empty" id="empty" hidden>目前沒有事項 ✨</div>

    <footer>
      <span id="count"></span>
      <button id="clearDone" hidden>清除已完成</button>
    </footer>
  </main>

<script>
  const KEY = 'hermes.todos.v1';
  let tasks = JSON.parse(localStorage.getItem(KEY) || '[]');
  let filter = 'all';

  const list = document.getElementById('list');
  const empty = document.getElementById('empty');
  const count = document.getElementById('count');
  const clearDone = document.getElementById('clearDone');

  document.getElementById('date').textContent =
    new Date().toLocaleDateString('zh-Hant', { year:'numeric', month:'long', day:'numeric', weekday:'long' });

  function save() { localStorage.setItem(KEY, JSON.stringify(tasks)); }

  function render() {
    const visible = tasks.filter(t =>
      filter === 'all' ? true : filter === 'active' ? !t.done : t.done);

    list.innerHTML = '';
    visible.forEach(t => {
      const li = document.createElement('li');
      li.className = t.done ? 'done' : '';
      li.dataset.id = t.id;

      const check = document.createElement('button');
      check.className = 'check';
      check.setAttribute('aria-label', t.done ? '標記未完成' : '標記完成');
      check.innerHTML = '<svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 6.5L4.5 9 10 3" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      check.onclick = () => { t.done = !t.done; save(); render(); };

      const span = document.createElement('span');
      span.className = 'txt';
      span.textContent = t.text;

      const del = document.createElement('button');
      del.className = 'del';
      del.setAttribute('aria-label', '刪除');
      del.textContent = '✕';
      del.onclick = () => { tasks = tasks.filter(x => x.id !== t.id); save(); render(); };

      li.append(check, span, del);
      list.appendChild(li);
    });

    empty.hidden = visible.length > 0;
    const remain = tasks.filter(t => !t.done).length;
    count.textContent = tasks.length ? `尚有 ${remain} 項未完成` : '';
    clearDone.hidden = !tasks.some(t => t.done);
  }

  document.getElementById('addForm').onsubmit = e => {
    e.preventDefault();
    const input = document.getElementById('taskInput');
    const text = input.value.trim();
    if (!text) return;
    tasks.unshift({ id: Date.now(), text, done: false });
    input.value = '';
    save(); render();
    input.focus();
  };

  document.getElementById('filters').onclick = e => {
    const btn = e.target.closest('button');
    if (!btn) return;
    filter = btn.dataset.f;
    document.querySelectorAll('#filters button').forEach(b => b.classList.toggle('active', b === btn));
    render();
  };

  clearDone.onclick = () => {
    tasks = tasks.filter(t => !t.done);
    save(); render();
  };

  render();
</script>
</body>
</html>
