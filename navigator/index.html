<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KeithSir Web App 導覽</title>
<style>
:root{
  --bg:#0f1524; --panel:#171f33; --panel2:#1e2841; --line:#2a3550;
  --ink:#eaf0fb; --muted:#93a1bf; --accent:#4ea1ff; --good:#34d399;
  --warn:#ffb347; --archived:#8b95ab; --chip:#212c48;
  --shadow:0 8px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 80% -10%,#1a2b4d 0,transparent 60%),var(--bg);
  color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1100px;margin:0 auto;padding:34px 20px 70px}
header h1{font-size:28px;margin:0 0 6px}
header .sub{color:var(--muted);font-size:14px}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:22px 0 8px}
.search{flex:1 1 260px}
.search input{width:100%;background:var(--chip);border:1px solid var(--line);color:var(--ink);
  border-radius:12px;padding:11px 14px;font:inherit;font-size:14px}
.search input:focus{outline:none;border-color:var(--accent)}
.search .icon{margin-right:8px;opacity:.6}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 22px}
.chip{background:var(--chip);border:1px solid var(--line);color:var(--muted);border-radius:999px;
  padding:7px 14px;font-size:13px;cursor:pointer;transition:all .15s;user-select:none}
.chip:hover{border-color:var(--accent);color:var(--ink)}
.chip.active{background:var(--accent);border-color:var(--accent);color:#04121f;font-weight:600}
.chip .n{opacity:.7;font-size:12px;margin-left:4px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);
  border-radius:16px;box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:12px;
  transition:transform .15s, border-color .15s}
.card:hover{transform:translateY(-3px);border-color:var(--accent)}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.card h3{margin:0;font-size:17px;line-height:1.4}
.badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap;letter-spacing:.3px}
.badge.live{background:rgba(52,211,153,.14);color:var(--good);border:1px solid rgba(52,211,153,.4)}
.badge.dev{background:rgba(255,179,71,.14);color:var(--warn);border:1px solid rgba(255,179,71,.4)}
.badge.archived{background:rgba(139,149,171,.14);color:var(--archived);border:1px solid rgba(139,149,171,.4)}
.desc{color:var(--muted);font-size:13.5px;flex:1}
.stack{display:flex;flex-wrap:wrap;gap:6px}
.stack span{background:var(--chip);border:1px solid var(--line);border-radius:6px;
  padding:3px 9px;font-size:12px;color:var(--ink)}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cats span{font-size:11.5px;color:var(--accent);background:rgba(78,161,255,.1);
  border-radius:999px;padding:2px 10px}
.card-foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:12px;margin-top:2px}
.card-foot .count{font-size:12px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#04121f;font-weight:600;
  font-size:13px;border-radius:10px;padding:8px 14px;text-decoration:none;transition:filter .15s}
.btn:hover{filter:brightness(1.1)}
.btn.disabled{background:var(--chip);color:var(--muted);pointer-events:none}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty .big{font-size:40px;margin-bottom:10px}
.error{border:1px solid #ff6b6b;background:rgba(255,107,107,.08);border-radius:12px;padding:16px 18px;
  font-size:14px;margin-top:20px}
.error code{background:var(--chip);padding:2px 8px;border-radius:6px;font-size:13px}
.result-info{font-size:13px;color:var(--muted);margin:0 0 14px}
.result-info b{color:var(--ink)}
@media print{
  body{background:#fff;color:#111}
  .wrap{max-width:100%;padding:0}
  .card{box-shadow:none;border:1px solid #ccc;background:#fff;transform:none}
  *{color:#111!important}
  .desc,.badge,.stack span,.cats span{color:#333!important}
  .toolbar,.chips{display:none!important}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>KeithSir Web App 導覽</h1>
    <div class="sub">所有網頁專案一覽：搜尋、分類篩選、一鍵跳轉。新增專案只需修改 <code>projects.json</code>。</div>
  </header>

  <div class="toolbar">
    <div class="search">
      <input type="search" id="q" placeholder="搜尋專案名稱、簡介或技術…" aria-label="搜尋專案">
    </div>
  </div>

  <div class="chips" id="catChips" role="group" aria-label="分類篩選"></div>
  <div class="chips" id="statusChips" role="group" aria-label="狀態篩選"></div>

  <p class="result-info" id="resultInfo" aria-live="polite"></p>

  <main>
    <div id="errorBox" class="error" hidden></div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden>
      <div class="big">🔍</div>
      <div>找不到符合條件的專案，請嘗試其他搜尋字或重設篩選。</div>
      <button class="btn" id="resetAll" style="margin-top:14px">重設篩選</button>
    </div>
  </main>
</div>

<script>
/* ===== 資料來源：navigator/projects.json（唯一需修改的檔案） ===== */
let DATA = null;
const state = { q:'', cat:'all', status:'all' };

async function load(){
  const box = document.getElementById('errorBox');
  try{
    const res = await fetch('projects.json', {cache:'no-cache'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    DATA = await res.json();
    if(!DATA || !Array.isArray(DATA.projects)) throw new Error('projects.json 格式錯誤（缺少 projects 陣列）');
    init();
  }catch(e){
    box.hidden = false;
    box.innerHTML = '<b>無法載入 projects.json</b>：'+esc(e.message)+
      (location.protocol==='file:'
        ? '<br><br>本頁需要透過 HTTP 開啟（GitHub Pages 或本地伺服器）。可執行：<code>python3 -m http.server</code> 後再瀏覽。'
        : '<br><br>請確認 <code>projects.json</code> 位於同目錄且為合法 JSON。');
    document.getElementById('grid').hidden = true;
  }
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function init(){
  buildChips();
  render();
}

function buildChips(){
  // category chips: "all" + each label key present in data
  const cats = new Set();
  DATA.projects.forEach(p=>(p.categories||[]).forEach(c=>cats.add(c)));
  const catKeys = DATA.categoryLabels ? Object.keys(DATA.categoryLabels) : [];
  const catSet = new Set([...catKeys, ...cats]);
  const cEl = document.getElementById('catChips');
  cEl.innerHTML = chip('cat','all','全部',catSet.size+1) +
    [...catSet].map(k=>chip('cat',k,(DATA.categoryLabels&&DATA.categoryLabels[k])||k,null)).join('');
  // status chips
  const sKeys = DATA.statusLabels ? Object.keys(DATA.statusLabels) : ['live','dev','archived'];
  document.getElementById('statusChips').innerHTML =
    chip('status','all','全部狀態',null) +
    sKeys.map(k=>chip('status',k,(DATA.statusLabels&&DATA.statusLabels[k])||k,null)).join('');
  cEl.querySelectorAll('.chip').forEach(el=>{
    el.onclick=()=>{state.cat=el.dataset.v;syncChips('cat',cEl);render();};
  });
  document.querySelectorAll('#statusChips .chip').forEach(el=>{
    el.onclick=()=>{state.status=el.dataset.v;syncChips('status',document.getElementById('statusChips'));render();};
  });
  document.getElementById('q').oninput = e=>{state.q=e.target.value;render();};
  document.getElementById('resetAll').onclick = reset;
}
function chip(type,v,label,count){
  return `<button class="chip${v===state[type]?' active':''}" data-v="${esc(v)}" aria-pressed="${v===state[type]}">${esc(label)}${count!==null?`<span class="n">${count}</span>`:''}</button>`;
}
function syncChips(type,root){
  root.querySelectorAll('.chip').forEach(el=>{
    const on = el.dataset.v===state[type];
    el.classList.toggle('active',on);
    el.setAttribute('aria-pressed',on);
  });
}
function reset(){
  state.q='';state.cat='all';state.status='all';
  document.getElementById('q').value='';
  syncChips('cat',document.getElementById('catChips'));
  syncChips('status',document.getElementById('statusChips'));
  render();
}

function filtered(){
  const q = state.q.trim().toLowerCase();
  return DATA.projects.filter(p=>{
    if(state.cat!=='all' && !(p.categories||[]).includes(state.cat)) return false;
    if(state.status!=='all' && p.status!==state.status) return false;
    if(q){
      const hay = [p.name,p.description,(p.stack||[]).join(' '),(p.categories||[]).join(' ')]
        .join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}

function render(){
  syncChips('cat',document.getElementById('catChips'));
  syncChips('status',document.getElementById('statusChips'));
  const rows = filtered();
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  document.getElementById('resultInfo').innerHTML =
    `共 <b>${DATA.projects.length}</b> 個專案` +
    (rows.length!==DATA.projects.length?`，目前顯示 <b>${rows.length}</b>`:'');

  if(!rows.length){grid.innerHTML='';grid.hidden=true;empty.hidden=false;return;}
  empty.hidden=true;grid.hidden=false;
  grid.innerHTML = rows.map(p=>{
    const sLabel=(DATA.statusLabels&&DATA.statusLabels[p.status])||p.status||'未知';
    const hasUrl = !!p.url;
    return `<article class="card">
      <div class="card-top">
        <h3>${esc(p.name)}</h3>
        <span class="badge ${esc(p.status||'archived')}" title="狀態">${esc(sLabel)}</span>
      </div>
      <p class="desc">${esc(p.description||'')}</p>
      <div class="cats">${(p.categories||[]).map(c=>`<span>${esc((DATA.categoryLabels&&DATA.categoryLabels[c])||c)}</span>`).join('')}</div>
      <div class="stack">${(p.stack||[]).map(s=>`<span>${esc(s)}</span>`).join('')}</div>
      <div class="card-foot">
        <span class="count">${hasUrl?'上線連結':'尚未上線'}</span>
        ${hasUrl
          ? `<a class="btn" href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">開啟 ↗</a>`
          : `<span class="btn disabled">待部署</span>`}
      </div>
    </article>`;
  }).join('');
}
load();
</script>
</body>
</html>
