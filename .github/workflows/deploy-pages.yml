name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Stage site files into _site
        run: |
          set -euo pipefail
          rm -rf _site && mkdir -p _site
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='_site' \
            ./ _site/
          printf 'User-agent: *\nAllow: /\n' > _site/robots.txt
          ls -la _site

      - name: Validate HTML
        run: |
          set -euo pipefail
          fail=0
          count=0
          while IFS= read -r f; do
            count=$((count + 1))
            if ! grep -qi '<html' "$f"; then echo "::error file=$f::missing <html>"; fail=1; fi
            if ! grep -qi '</html>' "$f"; then echo "::error file=$f::missing </html>"; fail=1; fi
          done < <(find _site -name '*.html' -type f)
          echo "checked $count html file(s)"
          exit $fail

      - name: Summarise build output
        run: |
          echo "Total size: $(du -sh _site | cut -f1)"
          echo "Files: $(find _site -type f | wc -l)"
          find _site -maxdepth 1 -mindepth 1 | sort

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
