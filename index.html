<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KeithSir Web 專案集</title>
<meta name="description" content="KeithSir 嘅網頁專案入口：所有 web app 一覽，可搜尋、分類篩選。資料由 projects.json 驅動。">
<style>
:root{
  --bg:#0e1424; --panel:#171f33; --panel2:#1e2841; --line:#2a3550;
  --ink:#eaf0fb; --muted:#93a1bf; --accent:#4ea1ff; --good:#34d399;
  --warn:#ffb347; --archived:#8b95ab; --chip:#212c48; --shadow:0 10px 30px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{margin:0;background:
  radial-gradient(1100px 560px at 85% -8%,#182a4d 0,transparent 60%),var(--bg);
  color:var(--ink);font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1040px;margin:0 auto;padding:56px 22px 70px}
.eyebrow{color:var(--accent);font-weight:700;letter-spacing:.5px;font-size:13px;text-transform:uppercase}
h1{margin:8px 0 6px;font-size:38px;line-height:1.2;letter-spacing:.3px}
.lead{color:var(--muted);max-width:640px;font-size:15.5px}
/* toolbar */
.toolbar{margin-top:26px}
.toolbar input{width:100%;background:var(--chip);border:1px solid var(--line);color:var(--ink);
  border-radius:14px;padding:13px 16px;font:inherit;font-size:14.5px}
.toolbar input:focus{outline:none;border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.chips .lbl{font-size:12px;color:var(--muted);font-weight:700;width:100%;margin-bottom:2px}
.chip{background:var(--chip);border:1px solid var(--line);color:var(--muted);border-radius:999px;
  padding:7px 15px;font:inherit;font-size:13.5px;font-weight:700;cursor:pointer;transition:all .15s;user-select:none}
.chip:hover{border-color:var(--accent);color:var(--ink)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#04121f}
.chip .n{opacity:.6;font-weight:600;margin-left:4px;font-size:12px}
.count{font-size:13px;color:var(--muted);margin:14px 0 4px}
.count b{color:var(--ink)}
/* grid + cards (hub look, data-driven) */
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));margin-top:26px}
.card{display:flex;flex-direction:column;gap:12px;background:linear-gradient(180deg,var(--panel),var(--panel2));
  border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow);
  text-decoration:none;color:inherit;transition:transform .15s,border-color .15s;min-height:190px}
.card:hover{transform:translateY(-4px);border-color:var(--accent)}
.card .top{display:flex;align-items:center;gap:12px}
.card .ico{font-size:30px;width:54px;height:54px;border-radius:14px;background:var(--chip);
  display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.card h2{margin:0;font-size:18px;line-height:1.3}
.card .sub{color:var(--muted);font-size:13px;margin-top:2px}
.card .desc{color:var(--muted);font-size:13.5px;flex:1}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--chip);
  border:1px solid var(--line);color:var(--ink)}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cats span{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px;background:rgba(78,161,255,.1);
  color:var(--accent)}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.status{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700}
.status .d{width:8px;height:8px;border-radius:50%}
.status.live{color:var(--good)} .status.live .d{background:var(--good);box-shadow:0 0 8px var(--good)}
.status.dev{color:var(--warn)} .status.dev .d{background:var(--warn);box-shadow:0 0 8px var(--warn)}
.status.archived{color:var(--archived)} .status.archived .d{background:var(--archived)}
.status.other{color:var(--muted)} .status.other .d{background:var(--muted)}
.go{font-weight:800;color:var(--accent);font-size:14px}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty .big{font-size:48px;margin-bottom:12px}
.empty button{margin-top:14px;background:var(--accent);color:#04121f;font:inherit;font-weight:800;
  border:0;border-radius:999px;padding:11px 22px;cursor:pointer}
.error{border:1px solid #ff6b6b;background:rgba(255,107,107,.08);border-radius:12px;padding:16px 18px;font-size:14px}
.error code{background:var(--chip);padding:2px 8px;border-radius:6px}
footer{margin-top:46px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
@media(max-width:520px){.wrap{padding:34px 14px 50px}h1{font-size:28px}}
@media print{
  body{background:#fff;color:#111}
  .card{box-shadow:none;border:1px solid #ccc;background:#fff;transform:none}
  *{color:#111!important}
  .desc,.sub,.tags span{color:#444!important}
  .toolbar,.chips,.error{display:none!important}
}
</style>
</head>
<body>
<div class="wrap">
  <div>
    <span class="eyebrow">Web 專案集</span>
    <h1>KeithSir 嘅網頁專案</h1>
    <p class="lead">所有 web app 一覽。搜尋、分類／狀態篩選，一鍵開走。新增專案只改 <code>projects.json</code> 一檔。</p>
  </div>

  <div class="toolbar">
    <input type="search" id="q" placeholder="🔍 搜尋專案名稱、簡介或技術…" aria-label="搜尋專案">
  </div>
  <div class="chips" id="catChips"><span class="lbl">分類</span></div>
  <div class="chips" id="statusChips"><span class="lbl">狀態</span></div>
  <p class="count" id="count" aria-live="polite"></p>

  <main>
    <div class="error" id="errorBox" hidden></div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden>
      <div class="big">🔍</div>
      <div>搵唔到符合條件嘅專案，試吓換個字或重設篩選。</div>
      <button id="resetAll" type="button">重設</button>
    </div>
  </main>

  <footer>KeithSir Web 專案集 · 部署於 GitHub Pages（KW75/HermesAgent）· 每個專案各自獨立資料夾</footer>
</div>

<script>
/* data-driven: projects.json 係唯一資料來源（加專案只改呢檔） */
const ICONS = { utility:'✅', analytics:'📊', landing:'🚀', api:'🧩', education:'🎓' };
let DATA = null;
const state = { q:'', cat:'all', status:'all' };
const $ = (id)=>document.getElementById(id);

async function load(){
  const box = $('errorBox');
  try{
    const res = await fetch('projects.json', {cache:'no-cache'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    DATA = await res.json();
    if(!DATA || !Array.isArray(DATA.projects)) throw new Error('projects.json 格式錯誤（缺少 projects 陣列）');
    init();
  }catch(e){
    box.hidden = false;
    box.innerHTML = '<b>無法載入 projects.json</b>：'+esc(e.message)+
      (location.protocol==='file:'
        ? '<br><br>需要透過 HTTP 開啟（GitHub Pages 或本地伺服器）。可執行：<code>python3 -m http.server</code> 再瀏覽。'
        : '<br><br>請確認 <code>projects.json</code> 喺根目錄且為合法 JSON。');
    $('grid').hidden = true;
  }
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function init(){
  buildChips(); render();
  $('q').oninput = e=>{ state.q=e.target.value; render(); };
  $('resetAll').onclick = reset;
}
function buildChips(){
  const catKeys = new Set([...Object.keys(DATA.categoryLabels||{}),
    ...DATA.projects.flatMap(p=>p.categories||[])]);
  fillChips('catChips','cat',[...catKeys], k=>{
    const n = DATA.projects.filter(p=>(p.categories||[]).includes(k)).length;
    return chipBtn('cat',k, (DATA.categoryLabels&&DATA.categoryLabels[k])||k, n);
  });
  const sKeys = new Set([...Object.keys(DATA.statusLabels||{}),
    ...DATA.projects.map(p=>p.status)]);
  fillChips('statusChips','status',[...sKeys], k=>{
    const n = DATA.projects.filter(p=>p.status===k).length;
    return chipBtn('status',k, (DATA.statusLabels&&DATA.statusLabels[k])||k, n);
  });
}
function fillChips(rootId,key,keys,make){
  const root = $(rootId);
  root.insertAdjacentHTML('beforeend',
    chipBtn(key,'all','全部', DATA.projects.length) + keys.map(make).join(''));
  root.querySelectorAll('.chip').forEach(el=>{
    el.onclick = ()=>{ state[key]=el.dataset.v; syncChips(root,key); render(); };
  });
}
function chipBtn(type,v,label,n){
  return `<button class="chip${v===state[type]?' on':''}" data-v="${esc(v)}" aria-pressed="${v===state[type]}">${esc(label)}${n!==undefined?`<span class="n">${n}</span>`:''}</button>`;
}
function syncChips(root,key){
  root.querySelectorAll('.chip').forEach(el=>{
    const on = el.dataset.v===state[key];
    el.classList.toggle('on',on); el.setAttribute('aria-pressed',on);
  });
}
function reset(){
  state.q='';state.cat='all';state.status='all';
  $('q').value='';
  syncChips($('catChips'),'cat'); syncChips($('statusChips'),'status');
  render();
}
function filtered(){
  const q = state.q.trim().toLowerCase();
  return DATA.projects.filter(p=>{
    if(state.cat!=='all' && !(p.categories||[]).includes(state.cat)) return false;
    if(state.status!=='all' && p.status!==state.status) return false;
    if(q){
      const hay=[p.name,p.description,(p.stack||[]).join(' '),(p.categories||[]).join(' ')]
        .join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}
function render(){
  syncChips($('catChips'),'cat'); syncChips($('statusChips'),'status');
  const rows = filtered();
  $('count').innerHTML = `共 <b>${DATA.projects.length}</b> 個專案` +
    (rows.length!==DATA.projects.length ? `，目前顯示 <b>${rows.length}</b>`:'');
  const grid = $('grid'), empty = $('empty');
  if(!rows.length){ grid.innerHTML=''; grid.hidden=true; empty.hidden=false; return; }
  empty.hidden=true; grid.hidden=false;
  grid.innerHTML = rows.map(p=>{
    const sLabel = (DATA.statusLabels&&DATA.statusLabels[p.status])||p.status||'未知';
    const sClass = ['live','dev','archived'].includes(p.status)?p.status:'other';
    const ico = (p.categories||[]).map(c=>ICONS[c]).find(Boolean)||'📄';
    const path = (p.url||'').replace(/^https?:\/\/[^/]+\//,'')||'（無連結）';
    return `<a class="card" href="${esc(p.url||'#')}" target="_blank" rel="noopener noreferrer"
        ${!p.url?' style="opacity:.6;pointer-events:none"':''}>
      <div class="top"><span class="ico">${ico}</span>
        <div><h2>${esc(p.name)}</h2><div class="sub">${esc(path)}</div></div></div>
      <p class="desc">${esc(p.description||'')}</p>
      <div class="cats">${(p.categories||[]).map(c=>`<span>${esc((DATA.categoryLabels&&DATA.categoryLabels[c])||c)}</span>`).join('')}</div>
      <div class="tags">${(p.stack||[]).map(s=>`<span>${esc(s)}</span>`).join('')}</div>
      <div class="foot"><span class="status ${esc(sClass)}"><span class="d"></span>${esc(sLabel)}</span>
        <span class="go">${p.url?'開啟 →':'待部署'}</span></div>
    </a>`;
  }).join('');
}
load();
</script>
</body>
</html>
